# pairir in a browser: the same codes as the apps, compiled to wasm and run
# in a Web Worker. Build: ./build.sh (output: dist/, any static host).
[package]
name = "pairir-web"
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
pairir = { path = ".." }
anyhow = "1"
iroh = { version = "1.4", default-features = false }
js-sys = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
zeroize = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[workspace]
