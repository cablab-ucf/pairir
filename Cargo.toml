[package]
name = "irpair"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
description = "Hand a secret to another device with a short code: CPace, one try, one minute, sealed post-quantum"
repository = "https://github.com/cablab-ucf/pairir"

[dependencies]
anyhow = "1"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = "0.11"
curve25519-dalek = { version = "5", default-features = false, features = ["zeroize"] }
data-encoding = "2"
getrandom = "0.4"
rand_chacha = { version = "0.10", default-features = false }
sha2 = "0.11"
iroh = { version = "1.4", default-features = false }
tokio = { version = "1", features = ["rt", "time"] }
x-wing = { version = "0.1", features = ["zeroize"] }
zeroize = "1"

[dev-dependencies]
iroh = { version = "1.4", default-features = false, features = ["tls-aws-lc-rs"] }
iroh-relay = { version = "1.4", default-features = false, features = ["server", "tls-aws-lc-rs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
